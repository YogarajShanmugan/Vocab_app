name: Build E-Ink Lexicon Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ZIP and prepare AndroidX
        run: |
          for z in *.zip; do unzip -o "$z"; done
          sed -i 's/package="com.lexicon.einkquiz"//g' app/src/main/AndroidManifest.xml || true
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: E-Ink-Lexicon-APK
          path: app/build/outputs/apk/debug/app-debug.apk
